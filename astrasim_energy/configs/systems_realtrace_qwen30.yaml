# Real-trace energy path, Qwen3-30B-A3B (224-request routed-expert trace).
#
# Batch sizes are the ones used in the original energy evaluation; they are fixed inputs,
# not derived by batch_sizing.py. The same trace is replayed for all three systems.
systems:
  - name: vllm
    batch_size: 14
    gpu_expert_budget: 128
    num_gpus: 4
    residency_policy: all

  - name: deepspeed_nvme
    batch_size: 32
    gpu_expert_budget: 0
    num_gpus: 4
    residency_policy: none

  - name: astra_moe
    batch_size: 32
    gpu_expert_budget: 64
    num_gpus: 4
    residency_policy: ther
    ther_window_size: 16
